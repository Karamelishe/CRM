{% extends "base.html" %}
{% block title %}Вход — E-Com Lab{% endblock %}
{% block content %}
<div class="card">
    <div class="card-content">
        <div class="card-header">
            <h2>Вход</h2>
            <a class="pill" href="/register">Регистрация</a>
        </div>
        <form id="loginForm">
            <div>
                <label class="muted">Email</label>
                <input name="email" type="email" required>
            </div>
            <div>
                <label class="muted">Пароль</label>
                <input name="password" type="password" required>
            </div>
            <button class="primary">Войти</button>
        </form>
    </div>
{% endblock %}
