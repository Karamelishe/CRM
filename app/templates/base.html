<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-commerce Cyber Range{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="shell">
        <header>
            <div class="logo">
                <div class="dot"></div>
                <div>
                    <div>E-Com Lab</div>
                    <div class="muted">Бизнес-логика под прицелом</div>
                </div>
            </div>
            <nav class="nav">
                <a href="/">Каталог</a>
                <a href="/cart">Корзина</a>
                <a href="/account">Мои заказы</a>
                <a href="/admin">Админ</a>
                <a href="/login">Вход</a>
                <button data-logout>Выйти</button>
            </nav>
        </header>
        {% block content %}{% endblock %}
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
