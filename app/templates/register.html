{% extends "base.html" %}
{% block title %}Регистрация — E-Com Lab{% endblock %}
{% block content %}
<div class="card">
    <div class="card-content">
        <div class="card-header">
            <h2>Регистрация</h2>
            <a class="pill" href="/login">Уже есть аккаунт</a>
        </div>
        <form id="registerForm">
            <div>
                <label class="muted">Полное имя</label>
                <input name="full_name" required>
            </div>
            <div>
                <label class="muted">Email</label>
                <input type="email" name="email" required>
            </div>
            <div>
                <label class="muted">Пароль</label>
                <input type="password" name="password" required>
            </div>
            <button class="primary">Создать аккаунт</button>
        </form>
    </div>
</div>
{% endblock %}
